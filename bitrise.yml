---
format_version: '23'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: macos
meta:
  bitrise.io:
    stack: osx-xcode-27.2.x
workflows:
  release:
    triggers:
      tag:
      - name: v*
    steps:
    - git-clone@8: {}
    - script@1:
        title: make lint test zip dmg
        inputs:
        - content: |-
            set -euo pipefail
            make lint test zip dmg
            cp build/*.zip build/*.dmg "$BITRISE_DEPLOY_DIR/"
    - deploy-to-bitrise-io@2: {}
    meta:
      bitrise.io:
        machine_type_id: g2.mac.medium
